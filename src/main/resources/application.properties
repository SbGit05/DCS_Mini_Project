# Distributed Banking System Configuration
server.port=${PORT:8085}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/distributed_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:bankapp}
spring.datasource.password=${DB_PASSWORD:bankapp123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Distributed System & RMI Configuration
bank.rmi.registry.host=localhost
bank.rmi.registry.port=1099
bank.coordinator.node-id=3

# Heartbeat & Fault Tolerance intervals
bank.cluster.heartbeat-interval-ms=3000
bank.cluster.heartbeat-timeout-ms=8000
